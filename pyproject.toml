[project]
name = "tinyllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sciencemj", email = "sciencemj.park@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "deeptool>=0.3.0",
    "numpy>=2.5.2",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
]

[project.scripts]
tinyllm = "tinyllm:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
