# PROVISIONAL: pick lr from a sample run. Set init_from to the pretrained checkpoint
# (weights only; optimizer and step restart from zero).
block_size: 1024
batch_size: 32
steps_per_chunk: 100
val_batches: 20
num_workers: 4
total_steps: 3000
lr: 2.0e-5
min_lr: 2.0e-6
warmup: 100
grad_clip: 1.0
weight_decay: 0.0
log_every_n_steps: 10
save_every_minutes: 30
init_from: null
