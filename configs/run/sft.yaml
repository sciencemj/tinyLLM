# Final SFT: one epoch of data/v2/chat_train.bin (600,386,464 tokens / 16,384 per step).
# lr 1e-4 from the probes: val/loss at step 2000 was 1.689 (1e-4) vs 1.793 (3e-5). init_from comes from
# INIT_FROM (weights only; optimizer and step restart from zero).
block_size: 1024
batch_size: 16  # 1024x32 OOMs on the L4 (22GB)
steps_per_chunk: 500
val_batches: 20
num_workers: 4
total_steps: 36644
lr: 1.0e-4
min_lr: 1.0e-5
warmup: 200
grad_clip: 1.0
# 0.1 matches v1's SFT lesson. LlamaConfig has no residual dropout here, so there is none
# to set; weight decay is the only regulariser.
weight_decay: 0.1
log_every_n_steps: 10
save_every_minutes: 30
init_from: null
samples:
  prompts: chat  # stories | chat | none; none disables sampling
  every_n_steps: 2000
