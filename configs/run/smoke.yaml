# Tiny settings for tests and quick path checks.
block_size: 16
batch_size: 4
steps_per_chunk: 2
val_batches: 2
num_workers: 0
total_steps: 4
lr: 1.0e-3
min_lr: 1.0e-4
warmup: 1
grad_clip: 1.0
weight_decay: 0.1
log_every_n_steps: 1
save_every_minutes: 30
init_from: null
samples:
  prompts: none  # stories | chat | none; none disables sampling
  every_n_steps: 2
