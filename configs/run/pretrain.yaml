# PROVISIONAL: batch size, steps and LR are set after the GPU benchmark.
block_size: 1024
batch_size: 32
# One validation pass and one best.ckpt write happen per chunk (an epoch), and both are costly
# at this scale, so use 5000 steps per chunk instead of the small-run 100.
steps_per_chunk: 5000
val_batches: 20
num_workers: 4
total_steps: 100000
lr: 6.0e-4
min_lr: 6.0e-5
warmup: 1000
grad_clip: 1.0
weight_decay: 0.1
log_every_n_steps: 10
save_every_minutes: 30
init_from: null
samples:
  prompts: stories  # stories | chat | none; none disables sampling
  every_n_steps: 1000
